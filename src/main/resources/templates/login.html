<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập | Online Exam</title>

<!-- Bootstrap 5 + Icons + Fonts -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow-x: hidden;
    }

    /* Hiệu ứng nền động */
    body::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255,255,255,0.1)" fill-opacity="0.2" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,154.7C960,171,1056,181,1152,165.3C1248,149,1344,107,1392,85.3L1440,64L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
        background-size: cover;
        pointer-events: none;
    }

    /* Card đăng nhập */
    .login-card {
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(10px);
        border-radius: 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        transition: transform 0.3s ease;
        border: 1px solid rgba(255,255,255,0.2);
        animation: fadeInUp 0.6s ease-out;
    }

    .login-card:hover {
        transform: translateY(-5px);
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Header card */
    .login-header {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        padding: 32px 24px;
        text-align: center;
        color: white;
    }

    .login-header h3 {
        font-weight: 800;
        margin-bottom: 8px;
        font-size: 1.8rem;
    }

    .login-header p {
        opacity: 0.9;
        font-size: 0.9rem;
        margin: 0;
    }

    .login-icon {
        width: 70px;
        height: 70px;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 2rem;
    }

    /* Body card */
    .login-body {
        padding: 32px 28px;
    }

    /* Input group với icon */
    .input-group-custom {
        margin-bottom: 24px;
    }

    .input-group-custom label {
        font-weight: 600;
        margin-bottom: 8px;
        color: #1e293b;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .input-group-custom label i {
        color: #4f46e5;
        width: 18px;
    }

    .input-group-custom input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        font-size: 0.95rem;
        transition: all 0.2s;
        background: #f8fafc;
    }

    .input-group-custom input:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        background: white;
    }

    /* Nút đăng nhập */
    .btn-login {
        background: linear-gradient(95deg, #4f46e5, #7c3aed);
        border: none;
        padding: 12px;
        border-radius: 40px;
        font-weight: 600;
        font-size: 1rem;
        color: white;
        width: 100%;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 8px;
    }

    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -8px #4f46e5;
        background: linear-gradient(95deg, #6366f1, #8b5cf6);
    }

    /* Alert thông báo lỗi */
    .alert-custom {
        background: #fee2e2;
        border-left: 4px solid #ef4444;
        color: #991b1b;
        padding: 12px 20px;
        border-radius: 16px;
        font-size: 0.85rem;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .alert-custom i {
        font-size: 1.1rem;
    }

    /* Footer */
    .login-footer {
        text-align: center;
        margin-top: 24px;
        font-size: 0.75rem;
        color: #64748b;
    }

    /* Responsive */
    @media (max-width: 576px) {
        .login-card {
            margin: 20px;
        }
        .login-body {
            padding: 24px 20px;
        }
        .login-header h3 {
            font-size: 1.5rem;
        }
    }
</style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">
                        <i class="fas fa-graduation-cap fa-2x"></i>
                    </div>
                    <h3>Online Exam</h3>
                    <p>Đăng nhập để tiếp tục</p>
                </div>

                <div class="login-body">
                    <!-- Hiển thị lỗi nếu có -->
                    <div th:if="${error}" class="alert-custom">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span th:text="${error}">Tên đăng nhập hoặc mật khẩu không đúng</span>
                    </div>

                    <!-- Form đăng nhập -->
                    <form th:action="@{/login}" method="post">
                        <div class="input-group-custom">
                            <label><i class="fas fa-user"></i> Tài khoản</label>
                            <input type="text" name="username" class="form-control" 
                                   placeholder="Nhập username" required autofocus>
                        </div>

                        <div class="input-group-custom">
                            <label><i class="fas fa-lock"></i> Mật khẩu</label>
                            <input type="password" name="password" class="form-control" 
                                   placeholder="Nhập mật khẩu" required>
                        </div>

                        <button type="submit" class="btn-login">
                            <i class="fas fa-sign-in-alt"></i> Đăng nhập
                        </button>
                    </form>

                    <div class="login-footer">
                        <i class="far fa-copyright"></i> 2025 Hệ thống thi trắc nghiệm
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
