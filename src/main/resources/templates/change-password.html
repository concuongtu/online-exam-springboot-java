<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đổi mật khẩu | Online Exam</title>

<!-- Bootstrap 5 + Icons + Fonts -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* ========= SIDEBAR ========= */
    .sidebar {
        background: linear-gradient(180deg, #0f172a 0%, #1e2a3a 100%);
        backdrop-filter: blur(2px);
        min-height: 100vh;
        box-shadow: 8px 0 25px -12px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    }

    .sidebar h4 {
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(120deg, #fff, #a5f3fc);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        font-size: 1.6rem;
        margin-bottom: 0;
        padding: 28px 0 16px 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar a {
        color: #e2e8f0;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        margin: 6px 12px;
        border-radius: 14px;
        font-weight: 500;
        transition: all 0.25s ease;
        font-size: 0.95rem;
    }

    .sidebar a i {
        width: 24px;
        font-size: 1.2rem;
        text-align: center;
    }

    .sidebar a:hover {
        background: rgba(13, 110, 253, 0.25);
        color: white;
        transform: translateX(5px);
    }

    .sidebar a.active {
        background: linear-gradient(90deg, #2563eb, #3b82f6);
        color: white !important;
        font-weight: 600;
        border-left: 4px solid #93c5fd;
        box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .sidebar a.active i {
        color: white !important;
    }

    .sidebar a.text-danger {
        color: #f87171;
    }
    .sidebar a.text-danger:hover {
        background: rgba(248, 113, 113, 0.2);
        color: #ffb4b4;
    }

    /* ========= MAIN CONTENT ========= */
    .content {
        background: #f8fafc;
        min-height: 100vh;
        padding: 30px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Form card - rộng tối đa, giảm chiều cao */
    .form-card {
        background: white;
        border-radius: 32px;
        box-shadow: 0 20px 40px -12px rgba(0,0,0,0.15);
        overflow: hidden;
        transition: transform 0.2s ease;
        border: 1px solid rgba(0,0,0,0.03);
        width: 100%;
    }

    .card-header-custom {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        padding: 20px 24px;
        text-align: center;
        color: white;
    }

    .card-header-custom h3 {
        font-weight: 700;
        margin-bottom: 4px;
        font-size: 1.5rem;
        letter-spacing: -0.2px;
    }

    .card-header-custom p {
        opacity: 0.9;
        margin: 0;
        font-size: 0.8rem;
    }

    .card-header-custom i {
        font-size: 2rem;
        margin-bottom: 8px;
        display: inline-block;
    }

    .card-body-custom {
        padding: 28px 32px;
    }

    /* Input group */
    .input-group-custom {
        margin-bottom: 20px;
    }

    .input-group-custom label {
        font-weight: 600;
        margin-bottom: 6px;
        color: #1e293b;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
    }

    .input-group-custom label i {
        color: #4f46e5;
        width: 18px;
    }

    .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .password-wrapper input {
        width: 100%;
        padding: 10px 48px 10px 16px;
        border: 1.5px solid #e2e8f0;
        border-radius: 28px;
        font-size: 0.9rem;
        transition: all 0.2s;
        background: #f8fafc;
    }

    .password-wrapper input:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        background: white;
    }

    .toggle-password {
        position: absolute;
        right: 16px;
        cursor: pointer;
        color: #94a3b8;
        font-size: 1rem;
        background: transparent;
        border: none;
        z-index: 5;
    }
    .toggle-password:hover {
        color: #4f46e5;
    }

    .confirm-feedback {
        font-size: 0.7rem;
        margin-top: 5px;
        margin-left: 12px;
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .confirm-feedback.success {
        color: #16a34a;
    }
    .confirm-feedback.error {
        color: #dc2626;
    }

    /* Button */
    .btn-update {
        background: linear-gradient(95deg, #4f46e5, #7c3aed);
        border: none;
        padding: 12px;
        border-radius: 40px;
        font-weight: 600;
        font-size: 0.95rem;
        color: white;
        width: 100%;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
    }
    .btn-update:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px -8px #4f46e5;
    }
    .btn-update:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }

    /* Alerts */
    .alert-custom {
        border-radius: 20px;
        padding: 10px 18px;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        border: none;
    }
    .alert-danger-custom {
        background: #fff1f0;
        border-left: 4px solid #ef4444;
        color: #b91c1c;
    }
    .alert-success-custom {
        background: #ecfdf5;
        border-left: 4px solid #10b981;
        color: #065f46;
    }

    /* Responsive */
    @media (max-width: 992px) {
        .sidebar {
            min-height: auto;
            margin-bottom: 20px;
        }
        .content {
            padding: 20px 16px;
            align-items: flex-start;
        }
        .card-body-custom {
            padding: 24px 20px;
        }
    }
    @media (max-width: 576px) {
        .card-header-custom h3 {
            font-size: 1.3rem;
        }
        .btn-update {
            padding: 10px;
        }
    }
</style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <h4 class="text-center">
                <i class="fas fa-graduation-cap me-2"></i>Online Exam
            </h4>
            <div class="menu-links mt-3">
                <a th:href="@{/home}"><i class="fas fa-home"></i> Trang chủ</a>
                <a th:if="${user.role == 'admin'}" th:href="@{/users}"><i class="fas fa-users"></i> Quản lý người dùng</a>
                <a th:if="${user.role == 'admin'}" th:href="@{/subjects}"><i class="fas fa-book-open"></i> Quản lý môn học</a>
                <a th:if="${user.role == 'admin'}" th:href="@{/questions}"><i class="fas fa-question-circle"></i> Quản lý câu hỏi</a>
                <a th:href="@{/select-subject}"><i class="fas fa-pen-alt"></i> Làm bài thi</a>
                <a th:href="@{/history}"><i class="fas fa-history"></i> Lịch sử thi</a>
                <a th:if="${user.role == 'admin'}" th:href="@{/dashboard}"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a th:if="${user.role == 'admin'}" th:href="@{/statistics}"><i class="fas fa-chart-simple"></i> Thống kê</a>
                <!-- Active cho Đổi mật khẩu -->
                <a th:href="@{/change-password}" class="active"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                <a th:href="@{/logout}" class="text-danger"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
            </div>
        </div>

        <!-- Main content - form rộng tối đa -->
        <div class="col-md-10 content">
            <div class="row justify-content-center w-100">
                <!-- Cột chiếm gần hết chiều ngang, chỉ chừa một khoảng nhỏ -->
                <div class="col-12 col-md-11 col-lg-10">
                    <div class="form-card">
                        <div class="card-header-custom">
                            <i class="fas fa-lock"></i>
                            <h3>Đổi mật khẩu</h3>
                            <p>Bảo mật tài khoản của bạn</p>
                        </div>
                        <div class="card-body-custom">
                            <!-- Thông báo server -->
                            <div th:if="${error}" class="alert-custom alert-danger-custom" id="serverAlert">
                                <i class="fas fa-exclamation-triangle"></i>
                                <span th:text="${error}">Mật khẩu cũ không đúng</span>
                            </div>
                            <div th:if="${success}" class="alert-custom alert-success-custom" id="serverSuccess">
                                <i class="fas fa-check-circle"></i>
                                <span th:text="${success}">Đổi mật khẩu thành công</span>
                            </div>

                            <form id="changePasswordForm" th:action="@{/change-password}" method="post" novalidate>
                                <!-- Mật khẩu cũ -->
                                <div class="input-group-custom">
                                    <label><i class="fas fa-key"></i> Mật khẩu cũ</label>
                                    <div class="password-wrapper">
                                        <input type="password" name="oldPassword" id="oldPassword" class="form-control" required autofocus>
                                        <button type="button" class="toggle-password" data-target="oldPassword">
                                            <i class="far fa-eye-slash"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Mật khẩu mới -->
                                <div class="input-group-custom">
                                    <label><i class="fas fa-lock"></i> Mật khẩu mới</label>
                                    <div class="password-wrapper">
                                        <input type="password" name="newPassword" id="newPassword" class="form-control" required>
                                        <button type="button" class="toggle-password" data-target="newPassword">
                                            <i class="far fa-eye-slash"></i>
                                        </button>
                                    </div>
                                </div>

                                <!-- Xác nhận mật khẩu mới -->
                                <div class="input-group-custom">
                                    <label><i class="fas fa-check-circle"></i> Nhập lại mật khẩu mới</label>
                                    <div class="password-wrapper">
                                        <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" required>
                                        <button type="button" class="toggle-password" data-target="confirmPassword">
                                            <i class="far fa-eye-slash"></i>
                                        </button>
                                    </div>
                                    <div id="confirmFeedback" class="confirm-feedback"></div>
                                </div>

                                <button type="submit" id="submitBtn" class="btn-update">
                                    <i class="fas fa-save"></i> Cập nhật mật khẩu
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer sát dưới, không bị đẩy xa -->
            <div class="text-center mt-4 pt-1 small text-muted w-100">
                <i class="far fa-copyright"></i> 2025 Online Exam Platform | Đổi mật khẩu an toàn
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // Toggle password visibility
        const toggleBtns = document.querySelectorAll('.toggle-password');
        toggleBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (input) {
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    const icon = this.querySelector('i');
                    icon.classList.toggle('fa-eye-slash');
                    icon.classList.toggle('fa-eye');
                }
            });
        });

        const oldPwd = document.getElementById('oldPassword');
        const newPwd = document.getElementById('newPassword');
        const confirmPwd = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const confirmFeedback = document.getElementById('confirmFeedback');

        // Validate confirm password
        function validateConfirm() {
            const newVal = newPwd.value;
            const confirmVal = confirmPwd.value;
            if (confirmVal === "") {
                confirmFeedback.innerHTML = "";
                confirmFeedback.className = "confirm-feedback";
                return false;
            }
            if (newVal !== confirmVal) {
                confirmFeedback.innerHTML = '<i class="fas fa-exclamation-circle"></i> Mật khẩu xác nhận không khớp';
                confirmFeedback.className = "confirm-feedback error";
                return false;
            } else {
                confirmFeedback.innerHTML = '<i class="fas fa-check-circle"></i> Khớp với mật khẩu mới';
                confirmFeedback.className = "confirm-feedback success";
                return true;
            }
        }

        // Basic validation before submit
        function validateForm() {
            const old = oldPwd.value.trim();
            const newP = newPwd.value;
            const confirm = confirmPwd.value;

            if (!old) {
                showTemporaryError("Vui lòng nhập mật khẩu cũ");
                return false;
            }
            if (newP.length < 8) {
                showTemporaryError("Mật khẩu mới phải có ít nhất 8 ký tự.");
                return false;
            }
            if (newP !== confirm) {
                showTemporaryError("Mật khẩu xác nhận không khớp.");
                return false;
            }
            if (old === newP) {
                showTemporaryError("Mật khẩu mới không được trùng với mật khẩu cũ.");
                return false;
            }
            return true;
        }

        function showTemporaryError(message) {
            let errDiv = document.getElementById('dynamicFrontError');
            if (!errDiv) {
                const alertContainer = document.querySelector('.card-body-custom');
                const div = document.createElement('div');
                div.id = 'dynamicFrontError';
                div.className = 'alert-custom alert-danger-custom mb-3';
                div.innerHTML = `<i class="fas fa-exclamation-triangle"></i><span>${message}</span>`;
                alertContainer.insertBefore(div, alertContainer.firstChild);
                setTimeout(() => { if(div) div.remove(); }, 4000);
            } else {
                errDiv.querySelector('span').innerText = message;
                setTimeout(() => { if(errDiv) errDiv.remove(); }, 4000);
            }
        }

        newPwd.addEventListener('input', validateConfirm);
        confirmPwd.addEventListener('input', validateConfirm);

        const form = document.getElementById('changePasswordForm');
        form.addEventListener('submit', function(e) {
            if (!validateForm()) {
                e.preventDefault();
                return false;
            }
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Đang xử lý...';
            return true;
        });

        // Auto hide server alerts
        const serverAlert = document.getElementById('serverAlert');
        const serverSuccess = document.getElementById('serverSuccess');
        if (serverAlert) setTimeout(() => serverAlert.style.display = 'none', 5000);
        if (serverSuccess) setTimeout(() => serverSuccess.style.display = 'none', 6000);
    })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
