<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đổi mật khẩu | Online Exam</title>

<!-- Bootstrap 5 + Icons + Fonts -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* ========= SIDEBAR ========= */
    .sidebar {
        background: linear-gradient(180deg, #0f172a 0%, #1e2a3a 100%);
        backdrop-filter: blur(2px);
        min-height: 100vh;
        box-shadow: 8px 0 25px -12px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    }

    .sidebar h4 {
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(120deg, #fff, #a5f3fc);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        font-size: 1.6rem;
        margin-bottom: 0;
        padding: 28px 0 16px 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar a {
        color: #e2e8f0;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        margin: 6px 12px;
        border-radius: 14px;
        font-weight: 500;
        transition: all 0.25s ease;
        font-size: 0.95rem;
    }

    .sidebar a i {
        width: 24px;
        font-size: 1.2rem;
        text-align: center;
    }

    .sidebar a:hover {
        background: rgba(13, 110, 253, 0.25);
        color: white;
        transform: translateX(5px);
    }

    .sidebar a.text-danger {
        color: #f87171;
    }
    .sidebar a.text-danger:hover {
        background: rgba(248, 113, 113, 0.2);
        color: #ffb4b4;
    }

    /* ========= MAIN CONTENT ========= */
    .content {
        background: #f8fafc;
        min-height: 100vh;
        padding: 28px 32px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Form card */
    .form-card {
        background: white;
        border-radius: 32px;
        box-shadow: 0 25px 50px -12px rgba(0,0,0,0.2);
        overflow: hidden;
        transition: transform 0.3s ease;
        border: 1px solid rgba(0,0,0,0.03);
        animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-card:hover {
        transform: translateY(-5px);
    }

    .card-header-custom {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        padding: 28px 24px;
        text-align: center;
        color: white;
    }

    .card-header-custom h3 {
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 1.6rem;
    }

    .card-header-custom p {
        opacity: 0.9;
        margin: 0;
        font-size: 0.85rem;
    }

    .card-header-custom i {
        font-size: 2.5rem;
        margin-bottom: 12px;
        display: inline-block;
    }

    .card-body-custom {
        padding: 32px 28px;
    }

    /* Input group */
    .input-group-custom {
        margin-bottom: 24px;
    }

    .input-group-custom label {
        font-weight: 600;
        margin-bottom: 8px;
        color: #1e293b;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .input-group-custom label i {
        color: #4f46e5;
        width: 18px;
    }

    .input-group-custom input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        font-size: 0.95rem;
        transition: all 0.2s;
        background: #f8fafc;
    }

    .input-group-custom input:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        background: white;
    }

    /* Buttons */
    .btn-update {
        background: linear-gradient(95deg, #4f46e5, #7c3aed);
        border: none;
        padding: 12px;
        border-radius: 40px;
        font-weight: 600;
        font-size: 1rem;
        color: white;
        width: 100%;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-update:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px -8px #4f46e5;
        background: linear-gradient(95deg, #6366f1, #8b5cf6);
    }

    /* Alerts */
    .alert-custom {
        border-radius: 20px;
        padding: 12px 20px;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
    }
    .alert-danger-custom {
        background: #fee2e2;
        border-left: 4px solid #ef4444;
        color: #991b1b;
    }
    .alert-success-custom {
        background: #dcfce7;
        border-left: 4px solid #22c55e;
        color: #166534;
    }

    /* Responsive */
    @media (max-width: 992px) {
        .sidebar {
            min-height: auto;
            margin-bottom: 20px;
        }
        .content {
            padding: 20px;
            align-items: flex-start;
        }
        .form-card {
            margin-top: 20px;
        }
    }
    @media (max-width: 576px) {
        .card-body-custom {
            padding: 24px 20px;
        }
        .card-header-custom h3 {
            font-size: 1.3rem;
        }
    }

    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
    }
</style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <h4 class="text-center"><i class="fas fa-graduation-cap me-2"></i>Online Exam</h4>
            <div class="menu-links mt-3">
                <a th:href="@{/home}"><i class="fas fa-home"></i> Trang chủ</a>
                <a th:href="@{/users}"><i class="fas fa-users"></i> Quản lý người dùng</a>
                <a th:href="@{/subjects}"><i class="fas fa-book-open"></i> Quản lý môn học</a>
                <a th:href="@{/questions}"><i class="fas fa-question-circle"></i> Quản lý câu hỏi</a>
                <a th:href="@{/select-subject}"><i class="fas fa-pen-alt"></i> Làm bài thi</a>
                <a th:href="@{/history}"><i class="fas fa-history"></i> Lịch sử thi</a>
                <a th:href="@{/dashboard}"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a th:href="@{/statistics}"><i class="fas fa-chart-simple"></i> Thống kê</a>
                <a th:href="@{/change-password}"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                <a th:href="@{/logout}" class="text-danger"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
            </div>
        </div>

        <!-- Main content -->
        <div class="col-md-10 content">
            <div class="row justify-content-center w-100">
                <div class="col-md-6 col-lg-5">
                    <div class="form-card">
                        <div class="card-header-custom">
                            <i class="fas fa-lock"></i>
                            <h3>Đổi mật khẩu</h3>
                            <p>Bảo mật tài khoản của bạn</p>
                        </div>
                        <div class="card-body-custom">
                            <!-- Thông báo lỗi -->
                            <div th:if="${error}" class="alert-custom alert-danger-custom">
                                <i class="fas fa-exclamation-triangle"></i>
                                <span th:text="${error}">Mật khẩu cũ không đúng</span>
                            </div>
                            <!-- Thông báo thành công -->
                            <div th:if="${success}" class="alert-custom alert-success-custom">
                                <i class="fas fa-check-circle"></i>
                                <span th:text="${success}">Đổi mật khẩu thành công</span>
                            </div>

                            <form th:action="@{/change-password}" method="post">
                                <div class="input-group-custom">
                                    <label><i class="fas fa-key"></i> Mật khẩu cũ</label>
                                    <input type="password" name="oldPassword" class="form-control" required autofocus>
                                </div>
                                <div class="input-group-custom">
                                    <label><i class="fas fa-lock"></i> Mật khẩu mới</label>
                                    <input type="password" name="newPassword" class="form-control" required>
                                </div>
                                <div class="input-group-custom">
                                    <label><i class="fas fa-check-circle"></i> Nhập lại mật khẩu mới</label>
                                    <input type="password" name="confirmPassword" class="form-control" required>
                                </div>
                                <button type="submit" class="btn-update">
                                    <i class="fas fa-save"></i> Cập nhật mật khẩu
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Footer nhẹ -->
            <div class="text-center mt-5 pt-2 small text-muted w-100">
                <i class="far fa-copyright"></i> 2025 Online Exam Platform | Đổi mật khẩu
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
