<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý môn học | Online Exam</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
        min-height: 100vh;
        overflow-x: hidden;
    }

    .sidebar {
        background: linear-gradient(180deg, #0f172a 0%, #1e2a3a 100%);
        backdrop-filter: blur(2px);
        min-height: 100vh;
        box-shadow: 8px 0 25px -12px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    }

    .sidebar h4 {
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(120deg, #fff, #a5f3fc);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        font-size: 1.6rem;
        margin-bottom: 0;
        padding: 28px 0 16px 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar a {
        color: #e2e8f0;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        margin: 6px 12px;
        border-radius: 14px;
        font-weight: 500;
        transition: all 0.25s ease;
        font-size: 0.95rem;
    }

    .sidebar a i {
        width: 24px;
        font-size: 1.2rem;
        text-align: center;
    }

    .sidebar a:hover {
        background: rgba(13, 110, 253, 0.25);
        color: white;
        transform: translateX(5px);
    }

    /* ===== ACTIVE MENU STYLES ===== */
    .sidebar a.active {
        background: linear-gradient(90deg, #2563eb, #3b82f6);
        color: white !important;
        font-weight: 600;
        border-left: 4px solid #93c5fd;
        box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }

    .sidebar a.active i {
        color: white !important;
    }

    .sidebar a.text-danger {
        color: #f87171;
    }
    .sidebar a.text-danger:hover {
        background: rgba(248, 113, 113, 0.2);
        color: #ffb4b4;
    }

    .content {
        background: #f8fafc;
        min-height: 100vh;
        padding: 28px 32px;
    }

    .page-header {
        background: white;
        border-radius: 28px;
        padding: 20px 28px;
        margin-bottom: 28px;
        box-shadow: 0 8px 20px -6px rgba(0,0,0,0.05);
        border: 1px solid rgba(0,0,0,0.03);
    }

    .page-header h2 {
        font-weight: 700;
        font-size: 1.8rem;
        background: linear-gradient(135deg, #0f172a, #2d3a5e);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .page-header h2 i {
        color: #2563eb;
    }

    .add-subject-form {
        background: white;
        border-radius: 24px;
        padding: 24px 28px;
        margin-bottom: 32px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.05);
        border-left: 5px solid #3b82f6;
    }

    .form-control {
        border-radius: 16px;
        border: 1px solid #e2e8f0;
        padding: 12px 16px;
        transition: 0.2s;
    }

    .form-control:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }

    .btn-primary {
        background: linear-gradient(95deg, #2563eb, #1e40af);
        border: none;
        padding: 10px 28px;
        border-radius: 40px;
        font-weight: 600;
        transition: 0.2s;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(37,99,235,0.3);
    }

    .table-container {
        background: white;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 12px 24px -12px rgba(0,0,0,0.1);
    }

    .table {
        margin-bottom: 0;
    }

    .table thead th {
        background: #f1f5f9;
        color: #0f172a;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 16px 12px;
    }

    .table tbody tr {
        transition: all 0.2s;
        border-bottom: 1px solid #eef2ff;
    }

    .table tbody tr:hover {
        background: #f8fafc;
        transform: scale(1.01);
    }

    .subject-badge {
        background: #e0f2fe;
        color: #0369a1;
        padding: 6px 14px;
        border-radius: 40px;
        font-weight: 500;
        display: inline-block;
    }

    .btn-danger {
        background: #ef4444;
        border: none;
        border-radius: 40px;
        padding: 5px 16px;
        font-weight: 500;
        transition: 0.2s;
    }

    .btn-danger:hover {
        background: #dc2626;
        transform: translateY(-2px);
    }

    .empty-state {
        text-align: center;
        padding: 48px 20px;
        color: #64748b;
    }

    @media (max-width: 992px) {
        .sidebar {
            min-height: auto;
            margin-bottom: 20px;
        }
        .content {
            padding: 20px;
        }
    }
    @media (max-width: 768px) {
        .table-container {
            overflow-x: auto;
        }
        .btn-primary {
            width: 100%;
        }
    }
</style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-2 sidebar p-0">
            <h4 class="text-center"><i class="fas fa-graduation-cap me-2"></i>Online Exam</h4>
            <div class="menu-links mt-3">
                <a th:href="@{/home}"><i class="fas fa-home"></i> Trang chủ</a>
                <a th:href="@{/users}"><i class="fas fa-users"></i> Quản lý người dùng</a>
                <!-- ĐÃ GẮN CỨNG CLASS ACTIVE CHO QUẢN LÝ MÔN HỌC -->
                <a th:href="@{/subjects}" class="active"><i class="fas fa-book-open"></i> Quản lý môn học</a>
                <a th:href="@{/questions}"><i class="fas fa-question-circle"></i> Quản lý câu hỏi</a>
                <a th:href="@{/select-subject}"><i class="fas fa-pen-alt"></i> Làm bài thi</a>
                <a th:href="@{/history}"><i class="fas fa-history"></i> Lịch sử thi</a>
                <a th:href="@{/dashboard}"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a th:href="@{/statistics}"><i class="fas fa-chart-simple"></i> Thống kê</a>
                <a th:href="@{/change-password}"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                <a th:href="@{/logout}" class="text-danger"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
            </div>
        </div>

        <div class="col-md-10 content">
            <div class="page-header">
                <h2><i class="fas fa-chalkboard"></i> Quản lý môn học</h2>
            </div>

            <div class="add-subject-form">
                <form th:action="@{/subjects/add}" th:object="${subject}" method="post">
                    <div class="row align-items-end">
                        <div class="col-md-8">
                            <label class="form-label fw-semibold"><i class="fas fa-plus-circle text-primary me-1"></i> Tên môn học mới</label>
                            <input type="text" th:field="*{subjectName}" class="form-control" placeholder="Ví dụ: Toán cao cấp, Lập trình Web..." required>
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-primary w-100"><i class="fas fa-save me-1"></i> Thêm môn học</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr><th>ID</th><th>Tên môn học</th><th>Thao tác</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="s : ${subjects}">
                            <td class="fw-semibold" th:text="${s.id}">1</td>
                            <td>
                                <span class="subject-badge">
                                    <i class="fas fa-graduation-cap me-1"></i>
                                    <span th:text="${s.subjectName}">Tên môn học</span>
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/subjects/delete/{id}(id=${s.id})}"
                                   class="btn btn-danger btn-sm delete-subject"
                                   th:data-name="${s.subjectName}">
                                    <i class="fas fa-trash-alt"></i> Xóa
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(subjects)}">
                            <td colspan="3" class="empty-state">
                                <i class="fas fa-folder-open fa-2x mb-2 d-block"></i>
                                Chưa có môn học nào. Hãy thêm môn học đầu tiên!
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="text-center mt-4 small text-muted">
                <i class="far fa-copyright"></i> 2025 Online Exam Platform | Quản lý môn học
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
