<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chọn môn thi | Online Exam</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Roboto',sans-serif; background:linear-gradient(135deg,#eef2f7 0%,#d9e2ec 100%); }
    .sidebar { background:linear-gradient(180deg,#0f172a 0%,#1e2a3a 100%); min-height:100vh; box-shadow:8px 0 25px -12px rgba(0,0,0,0.2); }
    .sidebar .logo-area { padding:28px 0 16px; border-bottom:1px solid rgba(255,255,255,0.08); margin-bottom:20px; text-align:center; }
    .sidebar .logo-area h4 { font-weight:700; background:linear-gradient(120deg,#fff,#a5f3fc); background-clip:text; -webkit-background-clip:text; color:transparent; font-size:1.6rem; margin:0; }
    .sidebar .logo-area p { font-size:0.7rem; color:#cbd5e1; margin-top:6px; }
    .sidebar a { color:#e2e8f0; text-decoration:none; display:flex; align-items:center; gap:12px; padding:12px 24px; margin:6px 12px; border-radius:14px; font-weight:500; transition:0.25s; font-size:0.95rem; }
    .sidebar a i { width:24px; font-size:1.2rem; text-align:center; }
    .sidebar a:hover { background:rgba(13,110,253,0.25); transform:translateX(5px); color:white; }
    .sidebar a.text-danger { color:#f87171; }
    .sidebar a.text-danger:hover { background:rgba(248,113,113,0.2); color:#ffb4b4; }
    .sidebar a.active { background:linear-gradient(90deg,#2563eb,#3b82f6); color:white !important; font-weight:600; border-left:4px solid #93c5fd; box-shadow:0 4px 12px rgba(37,99,235,0.3); }
    .sidebar a.active i { color:white !important; }
    .main-content { background:#f8fafc; min-height:100vh; padding:28px 32px; }
    .page-header { background:white; border-radius:28px; padding:20px 28px; margin-bottom:32px; box-shadow:0 8px 20px -6px rgba(0,0,0,0.05); }
    .page-header h2 { font-weight:700; font-size:1.8rem; background:linear-gradient(135deg,#0f172a,#2d3a5e); background-clip:text; -webkit-background-clip:text; color:transparent; margin:0; display:flex; align-items:center; gap:12px; }
    .page-header h2 i { color:#2563eb; }
    .subject-card { background:white; border-radius:24px; overflow:hidden; transition:0.3s; box-shadow:0 10px 20px -8px rgba(0,0,0,0.1); height:100%; display:flex; flex-direction:column; }
    .subject-card:hover { transform:translateY(-8px); box-shadow:0 20px 30px -12px rgba(0,0,0,0.2); }
    .card-icon { background:linear-gradient(135deg,#2563eb,#1e40af); padding:24px; text-align:center; color:white; }
    .card-icon i { font-size:3rem; }
    .card-body-custom { padding:24px; text-align:center; flex-grow:1; }
    .card-body-custom h5 { font-weight:700; font-size:1.25rem; color:#0f172a; margin-bottom:20px; }
    .btn-exam { background:linear-gradient(95deg,#22c55e,#16a34a); border:none; padding:10px 20px; font-weight:600; border-radius:40px; transition:0.2s; color:white; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .btn-exam:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(34,197,94,0.3); background:linear-gradient(95deg,#4ade80,#22c55e); }
    .empty-state { text-align:center; padding:60px 20px; color:#64748b; background:white; border-radius:28px; }
    .empty-state i { font-size:4rem; margin-bottom:20px; opacity:0.5; }
    @media (max-width:992px) { .sidebar { min-height:auto; margin-bottom:20px; } .main-content { padding:20px; } }
</style>
</head>
<body>
<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-md-2 sidebar p-0">
            <div class="logo-area text-center">
                <h4><i class="fas fa-graduation-cap me-2"></i>Online Exam</h4>
                
            </div>
            <div class="menu-links">
                <a th:href="@{/home}" th:classappend="${activePage == 'home'} ? 'active' : ''">
                    <i class="fas fa-home"></i> Trang chủ
                </a>
                <a th:if="${user.role == 'admin'}" th:href="@{/users}" th:classappend="${activePage == 'users'} ? 'active' : ''">
                    <i class="fas fa-users"></i> Quản lý người dùng
                </a>
                <a th:if="${user.role == 'admin'}" th:href="@{/subjects}" th:classappend="${activePage == 'subjects'} ? 'active' : ''">
                    <i class="fas fa-book-open"></i> Quản lý môn học
                </a>
                <a th:if="${user.role == 'admin'}" th:href="@{/questions}" th:classappend="${activePage == 'questions'} ? 'active' : ''">
                    <i class="fas fa-question-circle"></i> Quản lý câu hỏi
                </a>
                <!-- ĐÃ GẮN CỨNG CLASS ACTIVE CHO LÀM BÀI THI -->
                <a th:href="@{/select-subject}" class="active">
                    <i class="fas fa-pen-alt"></i> Làm bài thi
                </a>
                <a th:href="@{/history}" th:classappend="${activePage == 'history'} ? 'active' : ''">
                    <i class="fas fa-history"></i> Lịch sử thi
                </a>
                <a th:if="${user.role == 'admin'}" th:href="@{/dashboard}" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a th:if="${user.role == 'admin'}" th:href="@{/statistics}" th:classappend="${activePage == 'statistics'} ? 'active' : ''">
                    <i class="fas fa-chart-simple"></i> Thống kê
                </a>
                <a th:href="@{/change-password}" th:classappend="${activePage == 'password'} ? 'active' : ''">
                    <i class="fas fa-key"></i> Đổi mật khẩu
                </a>
                <a th:href="@{/logout}" class="text-danger mt-2">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </a>
            </div>
        </div>
        <div class="col-md-10 main-content">
            <div class="page-header">
                <h2><i class="fas fa-pencil-alt"></i> Chọn môn thi</h2>
            </div>
            <div class="row g-4" th:if="${#lists.size(subjects) > 0}">
                <div class="col-md-4 col-sm-6" th:each="s : ${subjects}">
                    <div class="subject-card">
                        <div class="card-icon"><i class="fas fa-book-open"></i></div>
                        <div class="card-body-custom">
                            <h5 th:text="${s.subjectName}"></h5>
                            <a th:href="@{/exam/{id}(id=${s.id})}" class="btn-exam"><i class="fas fa-play"></i> Thi ngay</a>
                        </div>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(subjects)}" class="empty-state">
                <i class="fas fa-folder-open"></i>
                <div class="mt-3">Hiện chưa có môn học nào. Vui lòng quay lại sau.</div>
            </div>
            <div class="text-center mt-5 pt-3 small text-muted">
                <i class="far fa-copyright"></i> 2025 Online Exam Platform | Chọn môn thi
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
