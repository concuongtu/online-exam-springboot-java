<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chọn môn thi | Online Exam</title>

<!-- Bootstrap 5 + Icons + Fonts -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #eef2f7 0%, #d9e2ec 100%);
        min-height: 100vh;
    }

    /* ========= SIDEBAR ========= */
    .sidebar {
        background: linear-gradient(180deg, #0f172a 0%, #1e2a3a 100%);
        backdrop-filter: blur(2px);
        min-height: 100vh;
        box-shadow: 8px 0 25px -12px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
    }

    .sidebar .logo-area {
        padding: 28px 0 16px 0;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        margin-bottom: 20px;
    }

    .sidebar .logo-area h4 {
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(120deg, #fff, #a5f3fc);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        font-size: 1.6rem;
        margin: 0;
    }

    .sidebar .logo-area p {
        font-size: 0.7rem;
        opacity: 0.7;
        margin-top: 6px;
        color: #cbd5e1;
    }

    .sidebar a {
        color: #e2e8f0;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        margin: 6px 12px;
        border-radius: 14px;
        font-weight: 500;
        transition: all 0.25s ease;
        font-size: 0.95rem;
    }

    .sidebar a i {
        width: 24px;
        font-size: 1.2rem;
        text-align: center;
    }

    .sidebar a:hover {
        background: rgba(13, 110, 253, 0.25);
        color: white;
        transform: translateX(5px);
    }

    .sidebar a.text-danger {
        color: #f87171;
    }
    .sidebar a.text-danger:hover {
        background: rgba(248, 113, 113, 0.2);
        color: #ffb4b4;
    }

    /* ========= MAIN CONTENT ========= */
    .main-content {
        background: #f8fafc;
        min-height: 100vh;
        padding: 28px 32px;
    }

    /* Header card */
    .page-header {
        background: white;
        border-radius: 28px;
        padding: 20px 28px;
        margin-bottom: 32px;
        box-shadow: 0 8px 20px -6px rgba(0,0,0,0.05);
        border: 1px solid rgba(0,0,0,0.03);
    }

    .page-header h2 {
        font-weight: 700;
        font-size: 1.8rem;
        background: linear-gradient(135deg, #0f172a, #2d3a5e);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .page-header h2 i {
        background: none;
        -webkit-background-clip: unset;
        color: #2563eb;
    }

    /* Subject card */
    .subject-card {
        background: white;
        border-radius: 24px;
        overflow: hidden;
        transition: all 0.3s ease;
        box-shadow: 0 10px 20px -8px rgba(0,0,0,0.1);
        border: 1px solid rgba(0,0,0,0.03);
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .subject-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 30px -12px rgba(0,0,0,0.2);
    }

    .card-icon {
        background: linear-gradient(135deg, #2563eb, #1e40af);
        padding: 24px;
        text-align: center;
        color: white;
    }

    .card-icon i {
        font-size: 3rem;
    }

    .card-body-custom {
        padding: 24px;
        text-align: center;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .card-body-custom h5 {
        font-weight: 700;
        font-size: 1.25rem;
        color: #0f172a;
        margin-bottom: 20px;
    }

    .btn-exam {
        background: linear-gradient(95deg, #22c55e, #16a34a);
        border: none;
        padding: 10px 20px;
        font-weight: 600;
        border-radius: 40px;
        transition: 0.2s;
        color: white;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-exam:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(34,197,94,0.3);
        background: linear-gradient(95deg, #4ade80, #22c55e);
        color: white;
    }

    /* Empty state */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #64748b;
        background: white;
        border-radius: 28px;
    }
    .empty-state i {
        font-size: 4rem;
        margin-bottom: 20px;
        opacity: 0.5;
    }

    /* Responsive */
    @media (max-width: 992px) {
        .sidebar {
            min-height: auto;
            margin-bottom: 20px;
        }
        .main-content {
            padding: 20px;
        }
    }
    @media (max-width: 768px) {
        .page-header h2 {
            font-size: 1.5rem;
        }
        .subject-card {
            margin-bottom: 20px;
        }
    }

    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: #e2e8f0;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 10px;
    }
</style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="logo-area text-center">
                <h4><i class="fas fa-graduation-cap me-2"></i>Online Exam</h4>
                <p>Trắc nghiệm trực tuyến</p>
            </div>
            <div class="menu-links">
                <a th:href="@{/home}"><i class="fas fa-home"></i> Trang chủ</a>
                <a th:href="@{/users}"><i class="fas fa-users"></i> Quản lý người dùng</a>
                <a th:href="@{/subjects}"><i class="fas fa-book-open"></i> Quản lý môn học</a>
                <a th:href="@{/questions}"><i class="fas fa-question-circle"></i> Quản lý câu hỏi</a>
                <a th:href="@{/select-subject}"><i class="fas fa-pen-alt"></i> Làm bài thi</a>
                <a th:href="@{/history}"><i class="fas fa-history"></i> Lịch sử thi</a>
                <a th:href="@{/dashboard}"><i class="fas fa-chart-line"></i> Dashboard</a>
                <a th:href="@{/statistics}"><i class="fas fa-chart-simple"></i> Thống kê</a>
                <a th:href="@{/change-password}"><i class="fas fa-key"></i> Đổi mật khẩu</a>
                <a th:href="@{/logout}" class="text-danger"><i class="fas fa-sign-out-alt"></i> Đăng xuất</a>
            </div>
        </div>

        <!-- Main content -->
        <div class="col-md-10 main-content">
            <div class="page-header">
                <h2><i class="fas fa-pencil-alt"></i> Chọn môn thi</h2>
            </div>

            <!-- Danh sách môn học -->
            <div class="row g-4" th:if="${#lists.size(subjects) > 0}">
                <div class="col-md-4 col-sm-6 mb-4" th:each="s : ${subjects}">
                    <div class="subject-card">
                        <div class="card-icon">
                            <i class="fas fa-book-open"></i>
                        </div>
                        <div class="card-body-custom">
                            <h5 th:text="${s.subjectName}">Toán cao cấp</h5>
                            <a th:href="@{/exam/{id}(id=${s.id})}" class="btn-exam">
                                <i class="fas fa-play"></i> Thi ngay
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Trường hợp không có môn học -->
            <div th:if="${#lists.isEmpty(subjects)}" class="empty-state">
                <i class="fas fa-folder-open"></i>
                <div class="mt-3">Hiện chưa có môn học nào. Vui lòng quay lại sau.</div>
            </div>

            <!-- Footer nhẹ -->
            <div class="text-center mt-5 pt-3 small text-muted">
                <i class="far fa-copyright"></i> 2025 Online Exam Platform | Chọn môn thi
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
